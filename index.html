<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PracticeCss — Gallery</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', sans-serif;
    background: #111;
    color: #eee;
    min-height: 100vh;
    padding: 60px 24px;
  }
  h1 {
    text-align: center;
    font-weight: 300;
    letter-spacing: 4px;
    text-transform: uppercase;
    margin-bottom: 48px;
    color: #fff;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 24px;
    max-width: 1000px;
    margin: 0 auto;
  }
  .card {
    display: block;
    background: #1b1b1b;
    border-radius: 10px;
    overflow: hidden;
    text-decoration: none;
    color: inherit;
    border: 1px solid #2a2a2a;
    transition: transform 0.2s ease, border-color 0.2s ease;
  }
  .card:hover {
    transform: translateY(-4px);
    border-color: #555;
  }
  .thumb {
    height: 160px;
    background: linear-gradient(to bottom, #1b1f4b, #ff7e5f, #ffd194);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .thumb.garden {
    background: linear-gradient(to bottom, #1f8fa0, #b5dab3, #fdef9b);
  }
  .thumb.polaroid-thumb {
    background: linear-gradient(155deg, #ddd3c2, #c4b7a0);
  }
  .thumb.polaroid-thumb .mini-polaroid {
    width: 84px;
    padding: 7px 7px 22px;
    background: #f7f2e6;
    border-radius: 2px;
    transform: rotate(-4deg);
    box-shadow: 0 6px 14px rgba(74, 62, 44, 0.35);
  }
  .thumb.polaroid-thumb .mini-polaroid::before {
    content: "";
    display: block;
    aspect-ratio: 1;
    background: radial-gradient(circle at 50% 35%, #4b4e45, #2b2e27);
  }
  .thumb.collage-thumb {
    background: #3a3128;
    position: relative;
    overflow: hidden;
  }
  .thumb.collage-thumb .sheet {
    position: absolute;
    inset: 18% 12%;
    background: #ece3cf;
    clip-path: polygon(2% 6%, 10% 2%, 26% 7%, 44% 1%, 63% 6%, 82% 2%, 97% 8%,
      94% 26%, 99% 46%, 95% 66%, 98% 86%, 88% 97%, 68% 92%, 48% 98%,
      30% 93%, 12% 98%, 3% 88%, 6% 66%, 1% 46%, 5% 26%);
    box-shadow: 0 8px 16px rgba(0,0,0,0.4);
  }
  .thumb.collage-thumb .p {
    position: absolute;
    width: 42px;
    padding: 4px 4px 12px;
    background: #f7f2e6;
    box-shadow: 0 4px 9px rgba(0,0,0,0.4);
  }
  .thumb.collage-thumb .p::before {
    content: ""; display: block; aspect-ratio: 1;
  }
  .thumb.collage-thumb .p.a {
    left: 20%; top: 42%; transform: rotate(-8deg);
  }
  .thumb.collage-thumb .p.a::before {
    background: linear-gradient(#e2ac66, #6b5647, #2f2924);
  }
  .thumb.collage-thumb .p.b {
    right: 16%; top: 20%; transform: rotate(5deg);
  }
  .thumb.collage-thumb .p.b::before {
    background: radial-gradient(60% 55% at 50% 40%, #7c5a3e, #301c12);
  }
  .thumb img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .card .label {
    padding: 16px 18px;
  }
  .card .label .title {
    font-size: 15px;
    font-weight: 600;
  }
  .card .label .sub {
    font-size: 12px;
    color: #999;
    margin-top: 4px;
  }
</style>
</head>
<body>
  <h1>PracticeCss</h1>
  <div class="grid">
    <a class="card" href="css-art/mountain-sunset/">
      <div class="thumb"></div>
      <div class="label">
        <div class="title">Mountain Sunset</div>
        <div class="sub">Pure CSS — no images</div>
      </div>
    </a>
    <a class="card" href="css-art/garden-river/">
      <div class="thumb garden">
        <img src="css-art/garden-river/garden-river.svg" alt="Spring river garden">
      </div>
      <div class="label">
        <div class="title">Spring River Garden</div>
        <div class="sub">SVG vector trace recreation</div>
      </div>
    </a>
    <a class="card" href="css-art/polaroid/">
      <div class="thumb polaroid-thumb">
        <div class="mini-polaroid"></div>
      </div>
      <div class="label">
        <div class="title">Polaroid Placeholder</div>
        <div class="sub">Pure CSS — undeveloped film</div>
      </div>
    </a>
    <a class="card" href="css-art/torn-paper-collage/">
      <div class="thumb collage-thumb">
        <div class="sheet"></div>
        <div class="p a"></div>
        <div class="p b"></div>
      </div>
      <div class="label">
        <div class="title">Torn Paper Collage</div>
        <div class="sub">Pure CSS — deckle-edge & polaroids</div>
      </div>
    </a>
  </div>
</body>
</html>
